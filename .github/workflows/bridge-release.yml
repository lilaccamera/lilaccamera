name: Attach the slow-motion bridge

# Attaches LilacSonyBridge.apk and bridge.sh to every published release, so the
# bridge install page can point at them. The bridge only serves a Lilac signed with
# its own key, so it is signed with the same release key secrets as the app.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the files to
        required: true

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - id: key
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -z "$RELEASE_KEYSTORE" ]; then
            echo "::warning::No RELEASE_KEYSTORE secret: the bridge was not attached to $TAG."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TAG }}

      - if: steps.key.outputs.present == 'true'
        uses: actions/setup-java@v5.0.0
        with:
          java-version: '21'
          distribution: 'corretto'

      - if: steps.key.outputs.present == 'true'
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: release.keystore
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # RELEASE_STORE_FILE resolves against the root project in :sonybridge
          printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > release.keystore
          ./gradlew :sonybridge:assembleRelease --console=plain
          rm release.keystore
          mkdir out
          cp sonybridge/build/outputs/apk/release/sonybridge-release.apk out/LilacSonyBridge.apk
          cp sonybridge/tools/bridge.sh out/bridge.sh

      - if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/LilacSonyBridge.apk out/bridge.sh --clobber --repo "$GITHUB_REPOSITORY"
